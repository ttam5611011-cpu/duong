name: Build Tweak

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build
        run: |
          export THEOS=$HOME/theos
          make package

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ForceUltraWide-deb
          path: packages/*.deb
